name: Wetterkarten Auto-Renderer

on:
  push: # Startet sofort, wenn du hier speicherst!
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-maps:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repository herunterladen
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🛠️ System-Bibliotheken installieren (für GRIB2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0

      - name: 📦 Python-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests xarray cfgrib numpy matplotlib geopandas scipy

      - name: 🎨 Karten rendern (render_worker.py starten)
        run: python render_worker.py

      - name: 💾 Bilder auf GitHub speichern (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Karten/
          git commit -m "🗺️ Update Wetterkarten (Auto-Render)" || echo "Keine neuen Bilder zum Speichern."
          git push
