import shutil

# --- EINSTELLUNGEN FÜR DEN WORKER ---
# Um den Server nicht zu überlasten, definieren wir hier, was gerendert werden soll.
MODELS_TO_RENDER = ["ICON-D2"] 
REGIONS_TO_RENDER = ["Deutschland"] # Später erweiterbar
PARAMS_TO_RENDER = ["Temperatur (2m)", "Akk. Niederschlag (mm)"]
FORECAST_HOURS = list(range(0, 49, 1)) # Von 0 bis 48 Stunden in 1h-Schritten

print("🚀 Starte Wetter-Render-Worker...")

# --- STANDARD-KONFIGURATION (Das hat gefehlt!) ---
DEFAULT_CONFIGS = {
    "Temperatur (2m)": [{"value": -10.0, "color": "#313695"}, {"value": 0.0, "color": "#74add1"}, {"value": 15.0, "color": "#fdae61"}, {"value": 30.0, "color": "#d73027"}],
    "Taupunkt (2m)": [{"value": -10.0, "color": "#313695"}, {"value": 0.0, "color": "#74add1"}, {"value": 10.0, "color": "#e0f3f8"}, {"value": 20.0, "color": "#fdae61"}],
    "Windböen 10m": [{"value": 0.0, "color": "#ffffff"}, {"value": 40.0, "color": "#ffffcc"}, {"value": 70.0, "color": "#fd8d3c"}, {"value": 100.0, "color": "#e31a1c"}, {"value": 130.0, "color": "#800026"}],
    "Akk. Niederschlag (mm)": [{"value": 0.0, "color": "#ffffff"}, {"value": 1.0, "color": "#a6cee3"}, {"value": 10.0, "color": "#1f78b4"}, {"value": 30.0, "color": "#33a02c"}],
    "Niederschlagsrate (mm/h)": [{"value": 0.0, "color": "#ffffff"}, {"value": 0.5, "color": "#a6cee3"}, {"value": 2.0, "color": "#1f78b4"}, {"value": 10.0, "color": "#33a02c"}, {"value": 25.0, "color": "#fb9a99"}],
    "500 hPa Geopot. Height": [{"value": 500.0, "color": "#313695"}, {"value": 540.0, "color": "#e0f3f8"}, {"value": 580.0, "color": "#d73027"}],
    "850 hPa Temp.": [{"value": -20.0, "color": "#313695"}, {"value": -10.0, "color": "#74add1"}, {"value": 0.0, "color": "#ffffff"}, {"value": 10.0, "color": "#fdae61"}, {"value": 20.0, "color": "#d73027"}],
    "MLCAPE": [{"value": 0.0, "color": "#ffffff"}, {"value": 250.0, "color": "#ffffcc"}, {"value": 1000.0, "color": "#fd8d3c"}, {"value": 2500.0, "color": "#e31a1c"}]
}

# --- CONFIG LADEN ---
try:
    with open("config.json", "r") as f:
        config_data = json.load(f)
except Exception as e:
    print(f"⚠️ Konnte config.json nicht laden, nutze Fallback. Fehler: {e}")
    config_data = DEFAULT_CONFIGS

# --- GRENZEN LADEN ---
print("🌍 Lade Kartengrenzen...")
world_url = "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson"
bl_url = "https://raw.githubusercontent.com/isellsoap/deutschlandGeoJSON/main/2_bundeslaender/4_niedrig.geo.json"
with tempfile.NamedTemporaryFile(suffix=".geojson", mode="w+", delete=False) as f1, tempfile.NamedTemporaryFile(suffix=".geojson", mode="w+", delete=False) as f2:
    f1.write(requests.get(world_url).text); f1_name = f1.name
    f2.write(requests.get(bl_url).text); f2_name = f2.name
world_gdf = gpd.read_file(f1_name)
bl_gdf = gpd.read_file(f2_name)
os.remove(f1_name); os.remove(f2_name)

# --- ZEIT-LOGIK ---
now = datetime.now(timezone.utc)
# Wir ziehen 2,5 Stunden ab, um sicherzugehen, dass der DWD-Lauf komplett online ist
effective_now = now - timedelta(hours=2.5)
latest_run = effective_now.replace(hour=(effective_now.hour // 3) * 3, minute=0, second=0, microsecond=0)
run_str = f"{latest_run.hour:02d}"
date_str = latest_run.strftime("%Y%m%d")
run_label = f"{latest_run.strftime('%Y-%m-%d_%H')}Z"
print(f"🕒 Aktueller Modelllauf: {run_label}")

# --- AUFRÄUMEN (Alte Läufe löschen) ---
base_folder = "Karten"
if os.path.exists(base_folder):
    for model_folder in os.listdir(base_folder):
        model_path = os.path.join(base_folder, model_folder)
        if os.path.isdir(model_path):
            for run_folder in os.listdir(model_path):
                try:
                    folder_time = datetime.strptime(run_folder, "%Y-%m-%d_%HZ").replace(tzinfo=timezone.utc)
                    if now - folder_time > timedelta(hours=24):
                        print(f"🗑️ Lösche alten Lauf: {run_folder}")
                        shutil.rmtree(os.path.join(model_path, run_folder))
                except: pass

# --- DWD DOWNLOAD LOGIK ---
def download_dwd_grib(run_time, f_hour, param):
    h_str = f"{f_hour:03d}"
    dwd_map = {
        "Temperatur (2m)": ("t_2m", "2d_t_2m"),
        "Akk. Niederschlag (mm)": ("tot_prec", "2d_tot_prec")
    }
    if param not in dwd_map: return None, None, None
    folder, var = dwd_map[param]
    
    url = f"https://opendata.dwd.de/weather/nwp/icon-d2/grib/{run_str}/{folder}/icon-d2_germany_regular-lat-lon_single-level_{date_str}{run_str}_{h_str}_{var}.grib2.bz2"
    
    try:
        resp = requests.get(url, timeout=10)
        if resp.status_code != 200: return None, None, None
        
        with tempfile.NamedTemporaryFile(delete=False, suffix='.grib2') as f:
            f.write(bz2.decompress(resp.content))
            t_path = f.name
            
        ds = xr.open_dataset(t_path, engine='cfgrib')
        act_var = list(ds.data_vars)[0]
        vals = np.squeeze(ds[act_var].values)
        lats, lons = ds['latitude'].values, ds['longitude'].values
        
        if lons.ndim == 1: lons, lats = np.meshgrid(lons, lats)
        ds.close(); os.remove(t_path)
        
        if param == "Temperatur (2m)": vals -= 273.15
        
        return lons, lats, vals
    except Exception as e:
        print(f"Fehler bei DL {param} +{f_hour}h: {e}")
        return None, None, None

# --- RENDER-FUNKTION ---
def render_and_save(lons, lats, data, param, hr, region, save_path):
    conf = config_data.get(param, DEFAULT_CONFIGS.get(param))
    levels = [c['value'] for c in sorted(conf, key=lambda x: x['value'])]
    colors = [c['color'] for c in sorted(conf, key=lambda x: x['value'])]
    min_v, max_v = min(levels), max(levels)
    if min_v == max_v: max_v += 1
    
    norm_levels = [(v - min_v) / (max_v - min_v) for v in levels]
    cmap = mcolors.LinearSegmentedColormap.from_list("custom", list(zip(norm_levels, colors)))
    
    fig, ax = plt.subplots(figsize=(10, 10))
    fig.patch.set_facecolor('#0E1117'); ax.set_facecolor('#0E1117')
    
    # Region Zoom
    if region == "Deutschland": ax.set_xlim(5.5, 15.5); ax.set_ylim(47.0, 55.0)
    
    karte = ax.contourf(lons, lats, data, levels=np.linspace(min_v, max_v, 150), cmap=cmap, extend='both', alpha=0.95)
    cbar = fig.colorbar(karte, ax=ax, fraction=0.046, pad=0.04, ticks=levels)
    cbar.set_label(param, color='white', size=12)
    cbar.ax.yaxis.set_tick_params(color='white', labelcolor='white')
    
    # ZAHLEN 
    dy = abs(lats[1, 0] - lats[0, 0]) * 111.0
    if dy < 0.01: dy = 2.2
    step = max(1, int(5 / dy)) # 5km Raster
    
    xmin, xmax, ymin, ymax = ax.get_xlim()[0], ax.get_xlim()[1], ax.get_ylim()[0], ax.get_ylim()[1]
    mask = (lons >= xmin) & (lons <= xmax) & (lats >= ymin) & (lats <= ymax) & ~np.isnan(data)
    grid_mask = np.zeros_like(mask, dtype=bool)
    grid_mask[::step, ::step] = True
    final_mask = mask & grid_mask
    
    valid_lons, valid_lats, valid_data = lons[final_mask], lats[final_mask], data[final_mask]
    
    for lon_val, lat_val, val in zip(valid_lons, valid_lats, valid_data):
        if "Niederschlag" in param and val < 0.1: continue
        txt = f"{val:.1f}" if "Niederschlag" in param else f"{val:.0f}"
        ax.text(lon_val, lat_val, txt, fontsize=8, color='black', ha='center', va='center', path_effects=[path_effects.withStroke(linewidth=1.5, foreground='white')])

    world_gdf.boundary.plot(ax=ax, edgecolor='white', linewidth=0.8, alpha=0.8)
    bl_gdf.boundary.plot(ax=ax, edgecolor='white', linewidth=1.2, alpha=1.0)
    ax.axis('off')
    
    title_time = (latest_run + timedelta(hours=hr)).strftime('%d.%m. %H:00 UTC')
    ax.text(ax.get_xlim()[0] + 0.2, ax.get_ylim()[1] - 0.5, f"ICON-D2 | +{hr}h | {title_time}", color='white', fontsize=10, bbox=dict(facecolor='#0E1117', alpha=0.7, edgecolor='none'))
    
    os.makedirs(os.path.dirname(save_path), exist_ok=True)
    fig.savefig(save_path, format="png", bbox_inches='tight', pad_inches=0, facecolor='#0E1117')
    plt.close(fig)

# --- HAUPTSCHLEIFE ---
for param in PARAMS_TO_RENDER:
    for hr in FORECAST_HOURS:
        print(f"Lade Daten: {param} +{hr}h...")
        lons, lats, data = download_dwd_grib(latest_run, hr, param)
        
        if lons is not None:
            for region in REGIONS_TO_RENDER:
                save_path = os.path.join(base_folder, "ICON-D2", run_label, param, f"{region}_{hr:03d}.png")
                # Nur rendern, wenn das Bild nicht schon existiert
                if not os.path.exists(save_path):
                    print(f"🎨 Rendere Karte: {save_path}")
                    render_and_save(lons, lats, data, param, hr, region, save_path)
                else:
                    print(f"✅ Bild existiert bereits: {save_path}")

print("🎉 Render-Job erfolgreich abgeschlossen!")
